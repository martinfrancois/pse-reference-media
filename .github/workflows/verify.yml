name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.5.18
      - name: Install Python dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Check clips against manifest.json
        run: python scripts/verify.py
      - name: Check the README clip table
        run: python scripts/render_readme.py --check
